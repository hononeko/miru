name: Continuous Delivery & Release

# Promotes the release candidate published by main.yml for this commit to the stable version: publishes its tested
# layers as X.Y.Z and `latest`, publishes the Helm chart X.Y.Z (whose default image is X.Y.Z) to
# oci://ghcr.io/<owner>/charts/miru, creates the GitHub Release with the packaged chart, and prunes old RCs. The image
# has a config of its own, as the release candidate reports X.Y.Z-rc.N as its version.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check the release candidate and list what would be tagged and pruned without changing anything
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/miru

jobs:
  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: read

  promote:
    name: Promote, Tag & Release
    needs: version
    if: needs.version.outputs.version_type != 'none'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_TAG: ${{ needs.version.outputs.version_tag }}
      COMMIT_TAG: ${{ needs.version.outputs.commit_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Only main publishes
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Releases are published from main only; dispatch with dry_run to check another branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release notes
        uses: hononeko/actions/release-notes@v1
        with:
          previous-tag: ${{ needs.version.outputs.last_tag }}
          tag: ${{ needs.version.outputs.version_tag }}
          summary: Release notes for ${{ needs.version.outputs.version_tag }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find release candidate
        id: rc
        uses: hononeko/actions/release-candidate@v1
        with:
          image: ${{ env.IMAGE }}
          tag: ${{ env.COMMIT_TAG }}
          version: ${{ env.VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build release image
        id: build
        env:
          RC_DIGEST: ${{ steps.rc.outputs.digest }}
        run: |
          output="type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true"
          if [ "$DRY_RUN" = "true" ]; then output=type=cacheonly; fi
          docker buildx build - \
            --platform linux/amd64,linux/arm64 \
            --build-context "release-candidate=docker-image://$IMAGE@$RC_DIGEST" \
            --build-arg "VERSION=$VERSION" \
            --provenance mode=max \
            --sbom true \
            --output "$output" \
            --metadata-file "$RUNNER_TEMP/release.json" <<'EOF'
          FROM release-candidate
          ARG VERSION
          LABEL org.opencontainers.image.version="${VERSION}"
          ENV MIRU_VERSION="${VERSION}"
          EOF
          if [ "$DRY_RUN" = "true" ]; then exit 0; fi
          echo "digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/release.json")" >> "$GITHUB_OUTPUT"

      - name: Check release image
        if: ${{ !inputs.dry_run }}
        env:
          RC_DIGEST: ${{ steps.rc.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          config() { docker buildx imagetools inspect "$IMAGE@$1" --format '{{json .Image}}'; }
          rc=$(config "$RC_DIGEST")
          release=$(config "$DIGEST")
          if ! jq -en --argjson rc "$rc" --argjson release "$release" \
            '($rc | map_values(.rootfs.diff_ids)) == ($release | map_values(.rootfs.diff_ids))'; then
            echo "::error::$IMAGE@$DIGEST does not have the layers of the release candidate $RC_DIGEST"
            exit 1
          fi
          if ! jq -en --argjson release "$release" --arg version "$VERSION" \
            'all($release[].config; .Labels["org.opencontainers.image.version"] == $version
              and any(.Env[]; . == "MIRU_VERSION=" + $version))'; then
            echo "::error::$IMAGE@$DIGEST does not report $VERSION"
            exit 1
          fi

      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote to stable
        env:
          RC_DIGEST: ${{ steps.rc.outputs.digest }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would publish the layers of $IMAGE@$RC_DIGEST as $VERSION and latest"
            echo "Dry run: would publish the layers of \`$RC_DIGEST\` as \`$VERSION\` and \`latest\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          for tag in "$VERSION" latest; do
            got=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$tag is $got, expected $DIGEST"
              exit 1
            fi
          done
          echo "Tagged \`$DIGEST\` as \`$VERSION\` and \`latest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "v4.3.2"

      # The chart in the repository has placeholder versions; the release stamps both, so the chart's default image
      # is the image promoted above.
      - name: Package Helm chart
        run: helm package charts/miru --version "$VERSION" --app-version "$VERSION" --destination "$RUNNER_TEMP/chart"

      - name: Publish Helm chart
        id: chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chart="$RUNNER_TEMP/chart/miru-$VERSION.tgz"
          repo="oci://$REGISTRY/$GITHUB_REPOSITORY_OWNER/charts"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would push $chart to $repo"
            echo "Dry run: would push the chart \`miru-$VERSION.tgz\` to \`$repo\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$GH_TOKEN" | helm registry login "$REGISTRY" --username "$GITHUB_ACTOR" --password-stdin
          helm push "$chart" "$repo" | tee "$RUNNER_TEMP/chart-push.txt"
          digest=$(sed -n 's/^Digest: //p' "$RUNNER_TEMP/chart-push.txt")
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::helm push did not report the digest of $repo/miru:$VERSION"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed the chart \`$repo/miru:$VERSION\` (\`$digest\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest Helm chart provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/miru
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Tag & create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION_TAG" --target "$GITHUB_SHA" --title "$VERSION_TAG" --notes-file release-notes.md \
            "$RUNNER_TEMP/chart/miru-$VERSION.tgz"

  prune:
    name: Prune Release Candidates
    needs: [version, promote]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select release candidate tags
        id: select
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LAST_TAG: ${{ needs.version.outputs.last_tag }}
        run: |
          range=HEAD
          if [ -n "$LAST_TAG" ]; then range="$LAST_TAG..HEAD"; fi
          commits=$(git rev-list "$range" | cut -c1-7 | paste -sd'|' -)
          pattern="^(${VERSION//./\\.}-rc\\.[0-9]+|sha-($commits))$"
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"
          echo "Pruning tags matching: $pattern"

      - name: Prune
        uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
        with:
          package: miru
          use-regex: true
          delete-tags: ${{ steps.select.outputs.pattern }}
          validate: true
          dry-run: ${{ inputs.dry_run }}
