name: Image

# Builds multi-arch images (amd64 & arm64), smoke-tests /healthz via hononeko/actions/smoke-test@v1,
# and with `push`, pushes per-arch images by digest to GHCR and uploads digest artifacts for publish-image@v1.
on:
  workflow_call:
    inputs:
      push:
        description: Push each architecture's image to GHCR by digest and upload digest artifacts
        type: boolean
        default: false
      ref:
        description: Commit ref to check out
        type: string
        default: ""
      version:
        description: Version baked into image labels; "dev" when empty
        type: string
        default: ""

jobs:
  build:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || '' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: inputs.push
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ inputs.push && format('type=image,name=ghcr.io/{0}/miru,push-by-digest=true,name-canonical=true,push=true', github.repository_owner) || '' }}
          load: ${{ !inputs.push }}
          tags: ${{ !inputs.push && format('smoke-miru:{0}', matrix.arch) || '' }}
          cache-from: type=gha,scope=miru-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=miru-${{ matrix.arch }}
          build-args: VERSION=${{ inputs.version || 'dev' }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push && 'true' || 'false' }}

      - name: Smoke test /healthz
        uses: hononeko/actions/smoke-test@v1
        with:
          image: ${{ inputs.push && format('ghcr.io/{0}/miru@{1}', github.repository_owner, steps.build.outputs.digest) || format('smoke-miru:{0}', matrix.arch) }}
          port: "8080"
          path: /healthz
          status: "200"
          timeout: "20"
          max-memory-mib: "384"
          env: |
            PLEX_URL=http://plex.local:32400
            PLEX_TOKEN=smoke-token
            AUTH_MODE=none
            DB_ENGINE=sqlite
            SQLITE_PATH=/data/miru.db

      - name: Export image digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
