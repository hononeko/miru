name: Main Validation

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build & Code Verification
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  integration:
    name: Integration Tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1
        with:
          cache-read-only: "true"

      - name: Run Integration Tests
        run: ./gradlew integrationTest --no-daemon

  version:
    uses: ./.github/workflows/version.yml
    permissions:
      contents: read

  image:
    name: Image Build & Smoke Test
    needs: [validate, integration, version]
    uses: ./.github/workflows/image.yml
    with:
      push: ${{ needs.version.outputs.version_type != 'none' }}
      version: ${{ needs.version.outputs.rc_version }}
    permissions:
      contents: read
      packages: write

  release-candidate:
    name: Publish Release Candidate
    needs: [version, image]
    if: needs.version.outputs.version_type != 'none'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release candidate
        uses: hononeko/actions/publish-image@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/miru
          tags: |
            ${{ needs.version.outputs.rc_version }}
            ${{ needs.version.outputs.commit_tag }}
            edge
          expected-digests: "2"
          attest: "true"
          title: Release candidate published

      # The chart X.Y.Z-rc.N runs the image above. Helm installs a pre-release only when asked for it by --version or
      # --devel, and cd.yml deletes these charts on release, with the release candidate images.
      - name: Publish release candidate chart
        uses: ./.github/actions/publish-chart
        with:
          version: ${{ needs.version.outputs.rc_version }}
