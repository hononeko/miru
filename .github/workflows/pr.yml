name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  version:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'snapshot') }}
    uses: ./.github/workflows/version.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    permissions:
      contents: read

  validate:
    name: Build & Code Verification
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  integration:
    name: Integration Tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1
        with:
          cache-read-only: "true"

      - name: Run Integration Tests
        run: ./gradlew integrationTest --no-daemon

  image:
    name: Image Build & Smoke Test
    needs: [validate, integration, version]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.integration.result == 'success' }}
    uses: ./.github/workflows/image.yml
    with:
      push: >-
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        && contains(github.event.pull_request.labels.*.name, 'snapshot') }}
      ref: ${{ github.event.pull_request.head.sha }}
      version: ${{ needs.version.outputs.snapshot_version }}
    permissions:
      contents: read
      packages: write

  snapshot:
    name: Publish Snapshot
    needs: [version, image]
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && contains(github.event.pull_request.labels.*.name, 'snapshot') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      pull-requests: write
      attestations: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snapshot image
        uses: hononeko/actions/publish-image@v1
        with:
          image: ghcr.io/${{ github.repository_owner }}/miru
          tags: |
            ${{ needs.version.outputs.snapshot_tag }}
            pr-${{ github.event.pull_request.number }}
          expected-digests: "2"
          attest: "true"
          title: Snapshot
          comment-on-pr: ${{ github.event.pull_request.number }}
          comment-note: For testing only. Deleted when this pull request closes.
