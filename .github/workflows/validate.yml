name: Validate

# Reusable workflow for building, linting, and verifying the codebase.
# Runs static repo linters (actions, Dockerfile, Kubernetes), type-resolved Detekt, and unit tests
# + Kover verification & changed-line coverage (80% minimum on PR source changes) in parallel jobs.
on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows and actions
        uses: hononeko/actions/lint-actions@v1

      - name: Lint Dockerfile
        uses: hononeko/actions/lint-docker@v1

      - name: Lint Kubernetes manifests
        uses: hononeko/actions/lint-k8s@v1

  detekt:
    name: Detekt
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1
        with:
          cache-read-only: "true"

      - name: Run Detekt
        run: ./gradlew detektMain detektTest --no-daemon

  frontend:
    name: Frontend (SvelteKit PWA)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify OpenAPI TypeScript schema is in sync
        run: bun run api:check

      - name: Typecheck SvelteKit app
        run: bun run check

      - name: Run frontend unit tests
        run: bun run test

      - name: Build static PWA bundle
        run: bun run build

  validate:
    name: Build & Code Verification
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1

      - name: Run unit tests and Kover verification
        run: ./gradlew test koverXmlReport koverVerify --no-daemon

      # PRs that touch no source or build files (e.g. docs/CI/k8s-only) have no changed lines
      # to measure, so the changed-line coverage gate is skipped for them.
      - name: Detect source changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" HEAD -- src/ build.gradle.kts settings.gradle.kts; then
            echo "Pull request changes no source or build files; skipping changed-line coverage."
            echo "source=false" >> "$GITHUB_OUTPUT"
          else
            echo "source=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Kover coverage
        if: steps.changes.outputs.source == 'true'
        uses: hononeko/actions/coverage@v1
        with:
          files: build/reports/kover/report.xml
          min-changed-coverage: "80"

      - name: Upload Kover coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-reports
          path: build/reports/kover/
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1
        with:
          cache-read-only: "true"

      - name: Build backend fat JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build static PWA bundle
        working-directory: web
        run: bun run build

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: web
        run: bun run test:e2e

      - name: Upload Playwright report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-e2e-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
