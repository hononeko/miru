name: Validate

# Reusable workflow for building, linting, and verifying the codebase.
# Runs static repo linters (actions, Dockerfile, Helm chart), type-resolved Detekt, and unit tests
# + Kover verification & changed-line coverage (80% minimum on PR source changes) in parallel jobs.
on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows and actions
        uses: hononeko/actions/lint-actions@v1

      - name: Lint Dockerfile
        uses: hononeko/actions/lint-docker@v1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: "v4.3.2"

      - name: Lint and validate Helm chart
        run: |
          set -euo pipefail
          # HTTPRoute and ServiceMonitor schemas from datreeio/CRDs-catalog, pinned to a commit (2026-11-11).
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/89c736bdde38b5fecd0f8436ec5f3aa3679a3b86/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          kubeconform() {
            docker run --rm -i \
              ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
              -strict -summary -schema-location default -schema-location "$crds" -
          }
          check() {
            helm lint charts/miru --strict "$@"
            helm template miru charts/miru --namespace miru "$@" | kubeconform
          }
          expect_failure() {
            if helm template miru charts/miru "$@" > /dev/null 2>&1; then
              echo "::error::helm template should have failed with: $*"
              exit 1
            fi
          }
          secret=(--set auth.sessionSecret=ci-session-secret-0123456789abcdefghij)

          check "${secret[@]}"
          check --set auth.mode=none

          check \
            --set database.engine=postgres \
            --set database.postgres.url=jdbc:postgresql://postgres:5432/miru \
            --set database.postgres.user=miru \
            --set strategy.type=RollingUpdate \
            --set existingSecret=miru-secrets

          check "${secret[@]}" \
            --set ingress.enabled=true \
            --set httpRoute.enabled=true \
            --set 'httpRoute.rules[0].timeouts.request=0s'

          check "${secret[@]}" \
            --set networkPolicy.enabled=true \
            --set metrics.enabled=true \
            --set database.engine=postgres \
            --set jellyfin.url=http://jellyfin:8096

          check "${secret[@]}" \
            --set service.type=LoadBalancer \
            --set metrics.enabled=true \
            --set metrics.serviceMonitor.enabled=true \
            --set metrics.serviceMonitor.namespace=monitoring \
            --set metrics.grafanaDashboard.enabled=true

          # Settings that would deploy a pod that cannot start or that would damage its data.
          expect_failure
          expect_failure --set auth.sessionSecret=too-short
          expect_failure "${secret[@]}" --set security.encryptionKey=too-short
          expect_failure --set existingSecret=miru-secrets --set plex.token=token
          expect_failure "${secret[@]}" --set strategy.type=RollingUpdate
          expect_failure "${secret[@]}" --set replicaCount=2

  detekt:
    name: Detekt
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1
        with:
          cache-read-only: "true"

      - name: Run Detekt
        run: ./gradlew detektMain detektTest --no-daemon

  frontend:
    name: Frontend (SvelteKit PWA)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify OpenAPI TypeScript schema is in sync
        run: bun run api:check

      - name: Typecheck SvelteKit app
        run: bun run check

      - name: Run frontend unit tests
        run: bun run test

      - name: Build static PWA bundle
        run: bun run build

  validate:
    name: Build & Code Verification
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1

      - name: Run unit tests and Kover verification
        run: ./gradlew test koverXmlReport koverVerify --no-daemon

      # PRs that touch no source or build files (e.g. docs/CI/k8s-only) have no changed lines
      # to measure, so the changed-line coverage gate is skipped for them.
      - name: Detect source changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && git diff --quiet "$BASE_SHA" HEAD -- src/ build.gradle.kts settings.gradle.kts; then
            echo "Pull request changes no source or build files; skipping changed-line coverage."
            echo "source=false" >> "$GITHUB_OUTPUT"
          else
            echo "source=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Kover coverage
        if: steps.changes.outputs.source == 'true'
        uses: hononeko/actions/coverage@v1
        with:
          files: build/reports/kover/report.xml
          min-changed-coverage: "80"

      - name: Upload Kover coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-reports
          path: build/reports/kover/
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Gradle & JDK
        uses: hononeko/actions/gradle-setup@v1
        with:
          cache-read-only: "true"

      - name: Build backend fat JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.5"

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build static PWA bundle
        working-directory: web
        run: bun run build

      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E suite
        working-directory: web
        run: bun run test:e2e

      - name: Upload Playwright report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-e2e-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
