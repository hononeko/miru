{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "miru.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "miru.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- /* Each rule is passed through as given (matches, filters, timeouts, ...); only backendRefs gets a default. */}}
    {{- range .Values.httpRoute.rules }}
    {{- $rule := deepCopy . }}
    {{- if not $rule.backendRefs }}
    {{- $_ := set $rule "backendRefs" (list (dict "name" $fullName "port" $svcPort "weight" 1)) }}
    {{- end }}
    - {{ toYaml $rule | indent 6 | trim }}
    {{- end }}
{{- end }}
