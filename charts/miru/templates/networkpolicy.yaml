{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "miru.fullname" . }}
  labels:
    {{- include "miru.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "miru.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if include "miru.dedicatedMetricsPort" . }}
    - ports:
        - port: metrics
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.egress.plex.enabled }}
    # Plex Media Server
    - ports:
        - port: {{ .Values.networkPolicy.egress.plex.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.jellyfin.enabled }}
    # Jellyfin Media Server
    - ports:
        - port: {{ .Values.networkPolicy.egress.jellyfin.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.egress.https.enabled }}
    # plex.tv, OIDC providers, avatar CDNs, and HTTPS webhooks
    - ports:
        - port: {{ .Values.networkPolicy.egress.https.port }}
          protocol: TCP
    {{- end }}
    {{- if or .Values.networkPolicy.egress.postgres.enabled (ne (lower .Values.database.engine) "sqlite") }}
    # PostgreSQL
    - ports:
        - port: {{ .Values.networkPolicy.egress.postgres.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
