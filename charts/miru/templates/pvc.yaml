{{- if and (include "miru.persistenceEnabled" .) (not .Values.persistence.existingClaim) (not (include "miru.isStatefulSet" .)) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "miru.pvcName" . }}
  labels:
    {{- include "miru.labels" . | nindent 4 }}
  {{- if or .Values.persistence.keep .Values.persistence.annotations }}
  annotations:
    {{- if .Values.persistence.keep }}
    # Keep the playback history when the release is uninstalled.
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- include "miru.pvcSpec" . | nindent 2 }}
{{- end }}
