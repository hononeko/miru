{{- if not .Values.existingSecret -}}
{{- $sessionSecret := include "miru.sessionSecret" . -}}
{{- $encryptionKey := include "miru.encryptionKey" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miru.secretName" . }}
  labels:
    {{- include "miru.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $sessionSecret }}
  AUTH_SESSION_SECRET: {{ $sessionSecret | quote }}
  {{- end }}
  {{- if $encryptionKey }}
  MIRU_ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  {{- end }}
  {{- if .Values.auth.adminPassword }}
  MIRU_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
  {{- end }}
  {{- if .Values.plex.token }}
  PLEX_TOKEN: {{ .Values.plex.token | quote }}
  {{- end }}
  {{- if .Values.jellyfin.apiKey }}
  JELLYFIN_API_KEY: {{ .Values.jellyfin.apiKey | quote }}
  {{- end }}
  {{- if .Values.database.postgres.password }}
  DATABASE_PASSWORD: {{ .Values.database.postgres.password | quote }}
  {{- end }}
  {{- if .Values.auth.oidc.clientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.auth.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
