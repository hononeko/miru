{{- if not .Values.existingSecret -}}
{{- $secretData := dict -}}
{{- with (include "miru.sessionSecret" . | trim) }}{{ $_ := set $secretData "AUTH_SESSION_SECRET" . }}{{ end -}}
{{- with (include "miru.encryptionKey" . | trim) }}{{ $_ := set $secretData "MIRU_ENCRYPTION_KEY" . }}{{ end -}}
{{- with .Values.auth.adminPassword }}{{ $_ := set $secretData "MIRU_ADMIN_PASSWORD" . }}{{ end -}}
{{- with .Values.plex.token }}{{ $_ := set $secretData "PLEX_TOKEN" . }}{{ end -}}
{{- with .Values.jellyfin.apiKey }}{{ $_ := set $secretData "JELLYFIN_API_KEY" . }}{{ end -}}
{{- with .Values.database.postgres.password }}{{ $_ := set $secretData "DATABASE_PASSWORD" . }}{{ end -}}
{{- with .Values.auth.oidc.clientSecret }}{{ $_ := set $secretData "OIDC_CLIENT_SECRET" . }}{{ end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "miru.secretName" . }}
  labels:
    {{- include "miru.labels" . | nindent 4 }}
type: Opaque
{{- if $secretData }}
data:
  {{- range $key := keys $secretData | sortAlpha }}
  {{ $key }}: {{ index $secretData $key | toString | b64enc | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
