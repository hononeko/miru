{{- if include "miru.isStatefulSet" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "miru.headlessServiceName" . }}
  labels:
    {{- include "miru.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
      name: http
  selector:
    {{- include "miru.selectorLabels" . | nindent 4 }}
{{- end }}
