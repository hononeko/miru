# Default values for miru.
# This is a YAML-formatted file.

# -- Miru holds live media server WebSocket connections and session state in memory; keep 1 replica.
replicaCount: 1

# -- Recreate lets the new pod attach the ReadWriteOnce SQLite volume after the old pod stops.
# When using PostgreSQL (database.engine=postgres), you can switch to RollingUpdate.
strategy:
  type: Recreate

image:
  repository: ghcr.io/hononeko/miru
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a ServiceAccount should be created.
  create: true
  # -- Automatically mount a ServiceAccount's API credentials.
  automount: false
  annotations: {}
  # -- Name of the ServiceAccount to use; generated from fullname template if unset.
  name: ""

podAnnotations: {}
podLabels: {}

# -- Restricted Pod Security Standard defaults matching the Distroless nonroot container (UID/GID 10001).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

service:
  type: ClusterIP
  port: 8080
  metricsPort: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: miru.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: miru-tls
  #    hosts:
  #      - miru.example.com

# -- Gateway API HTTPRoute (gateway.networking.k8s.io/v1).
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - miru.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# -- NetworkPolicy limiting inbound ports and outbound traffic to DNS, media servers, HTTPS, and PostgreSQL.
networkPolicy:
  enabled: false
  # -- Optional pod/namespace selectors for inbound web traffic; empty allows all sources on the http port.
  ingressFrom: []
  # -- Optional pod/namespace selectors for inbound metrics scraping; empty allows all sources on the metrics port.
  metricsFrom: []
  egress:
    plex:
      enabled: true
      port: 32400
    jellyfin:
      # -- Enabled automatically when jellyfin.url is set, or set explicitly to true.
      enabled: false
      port: 8096
    https:
      enabled: true
      port: 443
    postgres:
      # -- Enabled automatically when database.engine is postgres/postgresql, or set explicitly to true.
      enabled: false
      port: 5432
  extraIngress: []
  extraEgress: []

# -- Persistent storage for SQLite. Disabled automatically when database.engine is postgres/postgresql.
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

# -- Name of a pre-existing Secret (External Secrets, Sealed Secrets, SOPS, etc.) containing Miru secret env vars.
# When set, the chart does not create a Secret resource.
existingSecret: ""

# -- Server configuration (MIRU_*).
server:
  host: "0.0.0.0"
  port: 8080
  corsAllowedOrigins: ""
  trustProxyHeaders: false

# -- Logging configuration (LOG_LEVEL, ROOT_LOG_LEVEL).
logging:
  level: INFO
  rootLevel: INFO

# -- Database configuration (sqlite or postgres).
database:
  engine: sqlite
  sqlite:
    path: /data/miru.db
  postgres:
    url: ""
    user: ""
    # -- PostgreSQL password. Prefer existingSecret; otherwise pass via --set or an external values file.
    # password: ""
    maxPoolSize: 10

# -- Security keys.
security:
  # -- Encrypts Plex credentials & webhook secrets saved in the DB (at least 32 chars, e.g. `openssl rand -base64 48`).
  encryptionKey: ""

# -- Plex server configuration. Leave url & token unset to sign in via the Admin UI.
plex:
  url: ""
  token: ""
  pollIntervalSeconds: 20
  websocketEnabled: true
  clientIdentifier: ""
  tvBaseUrl: ""

# -- Jellyfin server configuration.
jellyfin:
  url: ""
  apiKey: ""
  pollIntervalSeconds: 20
  websocketEnabled: true
  clientIdentifier: ""

# -- Playback history settings.
session:
  minPlayDurationSeconds: 120
  resumeMergeWindowSeconds: 120
  watchedThresholdPercent: 85

# -- Read-only Tautulli compatibility API (/api/v2).
tautulliCompat:
  enabled: false

# -- Prometheus metrics endpoint & monitoring resources.
metrics:
  enabled: false
  host: "0.0.0.0"
  port: 9090
  serviceMonitor:
    enabled: false
    namespace: ""
    labels: {}
    annotations: {}
    interval: 30s
    scrapeTimeout: 10s
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"
    annotations: {}

# -- Automated stream guardrails.
guardrails:
  transcode4k:
    mode: disabled
    message: ""
  pausedTimeout:
    mode: disabled
    minutes: 30
    message: ""
  concurrentStreams:
    mode: disabled
    max: 2
    message: ""

# -- Authentication & OIDC configuration.
auth:
  mode: local
  # -- Signs session cookies (at least 32 chars, e.g. `openssl rand -base64 48`). Required unless auth.mode=none.
  sessionSecret: ""
  allowLocalLogin: true
  cookieSecure: auto
  # -- Optional bootstrap admin account created on startup if no admin exists yet.
  adminUsername: ""
  # -- Bootstrap admin password. Prefer existingSecret; otherwise pass via --set or an external values file.
  # adminPassword: ""
  rateLimit:
    enabled: true
    windowSeconds: 60
    loginMaxAttempts: 20
    accountMaxFailures: 10
    setupMaxAttempts: 10
  oidc:
    enabled: false
    issuerUrl: ""
    clientId: ""
    clientSecret: ""
    redirectUri: ""
    displayName: SSO
    scopes: openid,profile,email,groups
    groupsClaim: groups
    adminGroups: ""
    userGroups: ""
    autoLinkByEmail: true
    postLogoutRedirectUri: ""

# -- Additional environment variables appended to the Miru container.
extraEnv: []

# -- Additional envFrom entries (ConfigMap/Secret refs) appended to the Miru container.
extraEnvFrom: []

nodeSelector: {}
tolerations: []
affinity: {}
