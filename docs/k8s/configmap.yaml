apiVersion: v1
kind: ConfigMap
metadata:
  name: miru-config
data:
  MIRU_HOST: "0.0.0.0"
  MIRU_PORT: "8080"
  LOG_LEVEL: "INFO"

  # "sqlite" keeps the database on the miru-data volume.
  # "postgres" also needs the DATABASE_* keys in miru-secrets.
  DB_ENGINE: "sqlite"
  SQLITE_PATH: "/data/miru.db"

  # Leave PLEX_URL unset to connect from the Admin UI with Plex sign-in,
  # or set it together with PLEX_TOKEN in miru-secrets.
  # In-cluster Plex: http://<service>.<namespace>.svc.cluster.local:32400
  # PLEX_URL: "http://plex.example.com:32400"
  PLEX_POLL_INTERVAL_SECONDS: "20"
  PLEX_WEBSOCKET_ENABLED: "true"

  # "local", "oidc" or "none" (no login at all; only for trusted networks).
  AUTH_MODE: "local"

  # Single sign-on: set AUTH_MODE=oidc, or OIDC_ENABLED=true to offer it next to local logins.
  # OIDC_ENABLED: "true"
  # OIDC_ISSUER_URL: "https://auth.example.com/application/o/miru/"
  # OIDC_CLIENT_ID: "miru"
  # OIDC_REDIRECT_URI: "https://miru.example.com/api/v1/auth/oidc/callback"
  # OIDC_ADMIN_GROUPS: "miru-admins"
  # OIDC_USER_GROUPS: "miru-users"
