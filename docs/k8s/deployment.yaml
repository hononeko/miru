apiVersion: apps/v1
kind: Deployment
metadata:
  name: miru
  labels:
    app: miru
spec:
  # Miru holds the live Plex connection and session state in memory: run a single replica.
  replicas: 1
  # Recreate lets the new pod attach the ReadWriteOnce volume and SQLite database after the old one stops.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: miru
  template:
    metadata:
      labels:
        app: miru
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: miru
          image: ghcr.io/hononeko/miru
          envFrom:
            - configMapRef:
                name: miru-config
            - secretRef:
                name: miru-secrets
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: miru-data
        - name: tmp
          emptyDir: {}
