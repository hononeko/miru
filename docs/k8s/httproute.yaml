# Gateway API route. Point parentRefs at your Gateway and set your hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miru
spec:
  parentRefs:
    - name: gateway
      namespace: gateway-system
  hostnames:
    - "miru.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: miru
          port: 8080
