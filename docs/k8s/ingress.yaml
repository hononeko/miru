# Ingress. Set your hostname, and ingressClassName if the cluster has no default IngressClass.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miru
spec:
  # ingressClassName: traefik
  rules:
    - host: miru.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: miru
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - miru.example.com
  #     secretName: miru-tls
