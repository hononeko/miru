apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: miru

labels:
  - pairs:
      app.kubernetes.io/name: miru

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  # Expose Miru outside the cluster with one of these (set your hostname in the file first):
  # - httproute.yaml        # Gateway API
  # - ingress.yaml          # Ingress controller
  # Restrict traffic (needs a CNI that enforces NetworkPolicy):
  # - network-policy.yaml

images:
  - name: ghcr.io/hononeko/miru
    newTag: 1.0.0
