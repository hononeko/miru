# Limits Miru to the traffic it needs. Adjust the ports if Plex, PostgreSQL or your OIDC
# provider listen elsewhere, and narrow the ingress rule to your ingress controller or gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: miru
spec:
  podSelector:
    matchLabels:
      app: miru
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Web UI and API
    - ports:
        - port: http
          protocol: TCP
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Plex Media Server
    - ports:
        - port: 32400
          protocol: TCP
    # plex.tv (sign-in, users and avatars) and HTTPS OIDC providers
    - ports:
        - port: 443
          protocol: TCP
    # PostgreSQL (DB_ENGINE=postgres)
    - ports:
        - port: 5432
          protocol: TCP
