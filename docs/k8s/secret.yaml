# Fill in the values before applying, and keep the filled-in file out of version control.
# Miru refuses to start until AUTH_SESSION_SECRET is set (unless AUTH_MODE=none).
# To manage the secret another way (External Secrets, Sealed Secrets, SOPS, kubectl create secret),
# remove this file from kustomization.yaml and provide a Secret named miru-secrets with the same keys.
apiVersion: v1
kind: Secret
metadata:
  name: miru-secrets
type: Opaque
stringData:
  # Signs session cookies. At least 32 characters, e.g. `openssl rand -base64 48`.
  AUTH_SESSION_SECRET: ""
  # Encrypts the Plex credentials saved when you sign in to Plex from the Admin UI.
  # At least 32 characters, e.g. `openssl rand -base64 48`.
  MIRU_ENCRYPTION_KEY: ""

  # Optional: create the first admin on startup instead of using the first-run setup page.
  # MIRU_ADMIN_USERNAME: "admin"
  # MIRU_ADMIN_PASSWORD: ""        # at least 12 characters

  # Optional: a static Plex token instead of signing in from the Admin UI (requires PLEX_URL).
  # PLEX_TOKEN: ""

  # Required when DB_ENGINE=postgres.
  # DATABASE_URL: "jdbc:postgresql://postgres.example.com:5432/miru"
  # DATABASE_USER: "miru"
  # DATABASE_PASSWORD: ""

  # Required when OIDC is enabled and your provider issues a client secret.
  # OIDC_CLIENT_SECRET: ""
