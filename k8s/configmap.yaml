apiVersion: v1
kind: ConfigMap
metadata:
  name: miru-config
data:
  MIRU_HOST: "0.0.0.0"
  MIRU_PORT: "8080"
  DB_ENGINE: "sqlite"
  SQLITE_PATH: "/data/miru.db"
  PLEX_URL: "http://plex-ui.media.svc.cluster.local:32400"
  PLEX_POLL_INTERVAL_SECONDS: "20"
  PLEX_WEBSOCKET_ENABLED: "true"
  AUTH_MODE: "local"
  LOG_LEVEL: "INFO"
