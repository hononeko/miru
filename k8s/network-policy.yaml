apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miru-policy
spec:
  endpointSelector:
    matchLabels:
      app: miru
  egress:
    # Plex Media Server HTTP & WebSocket API
    - toEndpoints:
        - matchLabels:
            app: plex
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    # NAS PostgreSQL (when DB_ENGINE=postgres)
    - toCIDR:
        - "10.10.1.218/32"
      toPorts:
        - ports:
            - port: "15432"
              protocol: TCP
    # Optional plex.tv user/avatar resolution
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
