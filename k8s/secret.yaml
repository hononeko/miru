apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miru-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: miru-secrets
    creationPolicy: Owner
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: media/miru
        property: PLEX_TOKEN
    - secretKey: AUTH_SESSION_SECRET
      remoteRef:
        key: media/miru
        property: AUTH_SESSION_SECRET
    - secretKey: MIRU_ADMIN_USERNAME
      remoteRef:
        key: media/miru
        property: MIRU_ADMIN_USERNAME
    - secretKey: MIRU_ADMIN_PASSWORD
      remoteRef:
        key: media/miru
        property: MIRU_ADMIN_PASSWORD
    # Optional when switching DB_ENGINE=postgres:
    # - secretKey: DATABASE_URL
    #   remoteRef:
    #     key: media/miru
    #     property: DATABASE_URL
    # - secretKey: DATABASE_USER
    #   remoteRef:
    #     key: media/miru
    #     property: DATABASE_USER
    # - secretKey: DATABASE_PASSWORD
    #   remoteRef:
    #     key: media/miru
    #     property: DATABASE_PASSWORD
