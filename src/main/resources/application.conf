miru {
  server {
    host = "0.0.0.0"
    port = 8080
    corsAllowedOrigins = ""
  }

  database {
    engine = "sqlite"
    sqlite {
      path = "./data/miru.db"
    }
    postgres {
      url = ""
      user = ""
      password = ""
      maxPoolSize = 10
    }
  }

  plex {
    baseUrl = ""
    token = ""
    pollIntervalSeconds = 20
    websocketEnabled = true
  }

  session {
    minPlayDurationSeconds = 120
    resumeMergeWindowSeconds = 120
    watchedThresholdPercent = 85
  }

  auth {
    mode = "local"
    sessionSecret = ""
    adminUsername = ""
    adminPassword = ""
  }
}
