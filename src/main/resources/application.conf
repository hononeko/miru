miru {
  server {
    host = "0.0.0.0"
    port = 8080
    corsAllowedOrigins = ""
    staticWebDir = ""
    trustProxyHeaders = false
  }

  database {
    engine = "sqlite"
    sqlite {
      path = "./data/miru.db"
    }
    postgres {
      url = ""
      user = ""
      password = ""
      maxPoolSize = 10
    }
  }

  plex {
    url = ""
    token = ""
    plexTvBaseUrl = "https://plex.tv"
    clientIdentifier = ""
    pollIntervalSeconds = 20
    websocketEnabled = true
  }

  security {
    encryptionKey = ""
  }

  session {
    minPlayDurationSeconds = 120
    resumeMergeWindowSeconds = 120
    watchedThresholdPercent = 85
  }

  tautulliCompat {
    enabled = false
  }

  metrics {
    enabled = false
    host = "0.0.0.0"
    port = 9090
  }

  guardrails {
    transcode4k {
      mode = "disabled"
      message = "4K video transcoding is disabled on this server. Please select Direct Play or a 1080p version."
    }
    pausedTimeout {
      mode = "disabled"
      minutes = 30
      message = "Your stream was terminated because it remained paused for too long."
    }
    concurrentStreams {
      mode = "disabled"
      max = 2
      message = "You have exceeded the maximum number of simultaneous streams allowed for your account."
    }
  }

  auth {
    mode = "local"
    sessionSecret = ""
    adminUsername = ""
    adminPassword = ""
    allowLocalLogin = true
    cookieSecure = "auto"
    rateLimit {
      enabled = true
      windowSeconds = 60
      loginMaxAttempts = 20
      accountMaxFailures = 10
      setupMaxAttempts = 10
    }
    oidc {
      enabled = false
      issuerUrl = ""
      clientId = ""
      clientSecret = ""
      redirectUri = ""
      displayName = "SSO"
      scopes = "openid,profile,email,groups"
      groupsClaim = "groups"
      adminGroups = ""
      userGroups = ""
      autoLinkByEmail = true
      postLogoutRedirectUri = ""
    }
  }
}
