openapi: 3.1.0
info:
  title: Miru API
  version: 0.1.0
  description: >-
    Lightweight media server telemetry, live stream monitor, playback history tracker,
    and library analytics API.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /
    description: Current Miru instance

tags:
  - name: System
    description: Liveness, readiness, and API contract endpoints
  - name: Auth
    description: Local authentication, first-run admin setup, and session management
  - name: Admin
    description: Administrator-only account, media user linking, and API key management
  - name: Artwork
    description: Proxied media server artwork and SSRF-protected user avatar endpoints
  - name: Streams
    description: Live playback sessions and real-time Server-Sent Events (SSE) stream updates
  - name: Users
    description: Media server users and per-user playback analytics
  - name: History
    description: Playback history queries and play session detail records
  - name: Stats
    description: Global and per-user playback statistics and aggregations

  - name: Libraries
    description: Library section statistics, growth snapshots, recently added media, and manual sync triggers
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealthz
      summary: Liveness probe
      responses:
        '200':
          description: Service process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      tags: [System]
      operationId: getReadyz
      summary: Readiness probe
      description: Verifies registered dependency checks (database, media server).
      responses:
        '200':
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/v1/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenApiSpec
      summary: Retrieve OpenAPI 3.1 specification
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
        '404':
          description: OpenAPI specification resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/status:
    get:
      tags: [Auth]
      operationId: getAuthStatus
      summary: Retrieve authentication mode and initial setup status
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'

  /api/v1/auth/providers:
    get:
      tags: [Auth]
      operationId: getAuthProviders
      summary: Retrieve active authentication providers and SSO endpoints
      responses:
        '200':
          description: Active authentication provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'

  /api/v1/auth/oidc/login:
    get:
      tags: [Auth]
      operationId: oidcLogin
      summary: Initiate OIDC Authorization Code + PKCE login flow
      responses:
        '302':
          description: Redirect to OIDC identity provider authorization endpoint
        '409':
          description: OIDC authentication is disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: OIDC discovery metadata unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: Handle OIDC Authorization Code callback, verify ID token, and issue Miru session
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to application root on success or /login?error=... for HTML clients
        '401':
          description: Invalid OIDC state, nonce, or disabled account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: User is not a member of an authorized Miru group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: OIDC authentication is disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: OIDC token exchange, verification, or discovery failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/oidc/logout:
    get:
      tags: [Auth]
      operationId: oidcLogout
      summary: Invalidate Miru session and redirect to OIDC RP-Initiated Logout endpoint if configured
      responses:
        '302':
          description: Redirect to OIDC end_session_endpoint or /login

  /api/v1/auth/setup:
    post:
      tags: [Auth]
      operationId: setupInitialAdmin
      summary: Create the initial administrator account during first-run setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAdminRequest'
      responses:
        '201':
          description: Initial administrator created and session cookie issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '400':
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Initial administrator already configured or local auth disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded and signed session cookie issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          description: Invalid credentials or disabled account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Local authentication is disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate current session and clear session cookie
      responses:
        '204':
          description: Logged out and session cookie cleared

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentPrincipal
      summary: Get the currently authenticated principal
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Current authenticated principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          description: Missing, invalid, or expired credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/accounts:
    get:
      tags: [Admin]
      operationId: listAccounts
      summary: List all local accounts
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags: [Admin]
      operationId: createAccount
      summary: Create a new local account
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Linked media user not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Username already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/accounts/{id}:
    delete:
      tags: [Admin]
      operationId: deleteAccount
      summary: Delete a local account
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Account deleted
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Account not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Cannot delete self or last remaining admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/accounts/{id}/media-users:
    put:
      tags: [Admin]
      operationId: setLinkedMediaUsers
      summary: Replace linked media server user IDs for an account
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLinkedMediaUsersRequest'
      responses:
        '200':
          description: Updated account with linked media user IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Account or media user not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/api-keys:
    get:
      tags: [Admin]
      operationId: listApiKeys
      summary: List API keys (secrets redacted)
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags: [Admin]
      operationId: createApiKey
      summary: Create a new API key (raw key returned once)
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Target account not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/api-keys/{id}:
    delete:
      tags: [Admin]
      operationId: revokeApiKey
      summary: Revoke an API key
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key revoked
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: API key not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/imports/tautulli:
    post:
      tags: [Admin]
      operationId: importTautulliDatabase
      summary: Import historical users and playback history from a Tautulli SQLite database
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: dryRun
          in: query
          required: false
          description: Preview import counts without mutating the database
          schema:
            type: boolean
            default: false
        - name: serverId
          in: query
          required: false
          description: Optional target Miru media server ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Tautulli tautulli.db SQLite database file (max 256 MiB)
                dryRun:
                  type: boolean
                  description: Optional form field override when dryRun query parameter is omitted
                serverId:
                  type: string
                  description: Optional target Miru media server ID when serverId query parameter is omitted
      responses:
        '200':
          description: Tautulli import or dry-run report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TautulliImportResponse'
        '400':
          description: Invalid upload, non-SQLite file, or missing Tautulli tables
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Target media server not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/media/{ratingKey}/thumb:
    get:
      tags: [Artwork]
      operationId: getMediaThumb
      summary: Proxy media thumbnail artwork from the media server
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: ratingKey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
        - name: w
          in: query
          required: false
          description: Optional requested width in pixels (1-2000)
          schema:
            type: integer
            minimum: 1
            maximum: 2000
        - name: h
          in: query
          required: false
          description: Optional requested height in pixels (1-2000)
          schema:
            type: integer
            minimum: 1
            maximum: 2000
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Proxied thumbnail image bytes
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Artwork matches If-None-Match ETag
        '400':
          description: Invalid ratingKey or dimensions
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Artwork not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream media server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/media/{ratingKey}/art:
    get:
      tags: [Artwork]
      operationId: getMediaArt
      summary: Proxy media background art from the media server
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: ratingKey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
        - name: w
          in: query
          required: false
          description: Optional requested width in pixels (1-2000)
          schema:
            type: integer
            minimum: 1
            maximum: 2000
        - name: h
          in: query
          required: false
          description: Optional requested height in pixels (1-2000)
          schema:
            type: integer
            minimum: 1
            maximum: 2000
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Proxied background art image bytes
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Artwork matches If-None-Match ETag
        '400':
          description: Invalid ratingKey or dimensions
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Artwork not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream media server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/{id}/avatar:
    get:
      tags: [Artwork]
      operationId: getUserAvatar
      summary: Proxy user avatar from the media server or allowlisted HTTPS avatar host
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Proxied user avatar image bytes
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '304':
          description: Avatar matches If-None-Match ETag
        '400':
          description: Invalid or disallowed avatar URL target
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden access to user avatar
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: User or user avatar not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream avatar host error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/streams:
    get:
      tags: [Streams]
      operationId: listActiveStreams
      summary: List currently active media playback sessions
      description: >-
        Returns currently active streams scoped by the caller's RBAC permissions, including
        in-memory live transcode metadata overlay and proxied artwork/avatar URLs.
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Active streams list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveStreamsResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/streams/events:
    get:
      tags: [Streams]
      operationId: streamEvents
      summary: Subscribe to real-time active stream Server-Sent Events (SSE)
      description: >-
        Streams an initial `snapshot` event followed by `session_started`, `session_updated`,
        and `session_stopped` events scoped to the authenticated principal, plus periodic `: ping`
        keepalive comments.
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List media users with live streaming status and aggregate playback stats
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: List of media users visible to the authenticated principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersListResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUserDetail
      summary: Get detailed playback statistics, active streams, and recent plays for a media user
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media user detail summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Access to the requested media user is forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Media user not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/history:
    get:
      tags: [History]
      operationId: listPlaybackHistory
      summary: Query paginated, filtered, and sorted playback history
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: string
        - name: mediaType
          in: query
          required: false
          schema:
            type: string
            enum: [movie, episode, track, clip, live_tv]
        - name: libraryId
          in: query
          required: false
          schema:
            type: string
        - name: decision
          in: query
          required: false
          schema:
            type: string
            enum: [direct_play, direct_stream, transcode]
        - name: from
          in: query
          required: false
          description: Inclusive ISO-8601 UTC start timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Inclusive ISO-8601 UTC end timestamp
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          required: false
          description: Case-insensitive title, season, or series search query
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [stopped_at, started_at, watched_duration, completion_percent, title]
            default: stopped_at
        - name: sortDir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Paginated playback history items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden access to requested media user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/history/{id}:
    get:
      tags: [History]
      operationId: getPlaybackHistoryDetail
