openapi: 3.1.0
info:
  title: Miru API
  version: 0.1.0
  description: >-
    Lightweight media server telemetry, live stream monitor, playback history tracker,
    and library analytics API.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: /
    description: Current Miru instance

tags:
  - name: System
    description: Liveness, readiness, and API contract endpoints
  - name: Auth
    description: Local authentication, first-run admin setup, and session management
  - name: Admin
    description: Administrator-only account, media user linking, and API key management
  - name: Artwork
    description: Proxied media server artwork and SSRF-protected user avatar endpoints
  - name: Media
    description: Rich media item metadata, series/season context, technical specs, and Miru play summaries
  - name: Streams
    description: Live playback sessions and real-time Server-Sent Events (SSE) stream updates
  - name: Users
    description: Media server users and per-user playback analytics
  - name: History
    description: Playback history queries and play session detail records
  - name: Stats
    description: Global and per-user playback statistics and aggregations

  - name: Libraries
    description: Library section statistics, growth snapshots, recently added media, and manual sync triggers
paths:
  /healthz:
    get:
      tags: [System]
      operationId: getHealthz
      summary: Liveness probe
      responses:
        '200':
          description: Service process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /readyz:
    get:
      tags: [System]
      operationId: getReadyz
      summary: Readiness probe
      description: Verifies registered dependency checks (database, media server).
      responses:
        '200':
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: One or more dependencies are unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /api/v1/openapi.yaml:
    get:
      tags: [System]
      operationId: getOpenApiSpec
      summary: Retrieve OpenAPI 3.1 specification
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
        '404':
          description: OpenAPI specification resource not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/status:
    get:
      tags: [Auth]
      operationId: getAuthStatus
      summary: Retrieve authentication mode and initial setup status
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatusResponse'

  /api/v1/auth/providers:
    get:
      tags: [Auth]
      operationId: getAuthProviders
      summary: Retrieve active authentication providers and SSO endpoints
      responses:
        '200':
          description: Active authentication provider configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProvidersResponse'

  /api/v1/auth/oidc/login:
    get:
      tags: [Auth]
      operationId: oidcLogin
      summary: Initiate OIDC Authorization Code + PKCE login flow
      responses:
        '302':
          description: Redirect to OIDC identity provider authorization endpoint
        '409':
          description: OIDC authentication is disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: OIDC discovery metadata unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: Handle OIDC Authorization Code callback, verify ID token, and issue Miru session
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to application root on success or /login?error=... for HTML clients
        '401':
          description: Invalid OIDC state, nonce, or disabled account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: User is not a member of an authorized Miru group
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: OIDC authentication is disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: OIDC token exchange, verification, or discovery failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/oidc/logout:
    get:
      tags: [Auth]
      operationId: oidcLogout
      summary: Invalidate Miru session and redirect to OIDC RP-Initiated Logout endpoint if configured
      responses:
        '302':
          description: Redirect to OIDC end_session_endpoint or /login

  /api/v1/auth/setup:
    post:
      tags: [Auth]
      operationId: setupInitialAdmin
      summary: Create the initial administrator account during first-run setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupAdminRequest'
      responses:
        '201':
          description: Initial administrator created and session cookie issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '400':
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Initial administrator already configured or local auth disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded and signed session cookie issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          description: Invalid credentials or disabled account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Local authentication is disabled
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Invalidate current session and clear session cookie
      responses:
        '204':
          description: Logged out and session cookie cleared

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentPrincipal
      summary: Get the currently authenticated principal
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Current authenticated principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          description: Missing, invalid, or expired credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/me/preferences:
    get:
      tags: [Auth]
      operationId: getUserPreferences
      summary: Get current authenticated user's preferences
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Current user preferences (or defaults if none saved yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '401':
          description: Missing, invalid, or expired credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags: [Auth]
      operationId: updateUserPreferences
      summary: Update current authenticated user's preferences
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: Updated user preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '400':
          description: Invalid preference values
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing, invalid, or expired credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/accounts:
    get:
      tags: [Admin]
      operationId: listAccounts
      summary: List all local accounts
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags: [Admin]
      operationId: createAccount
      summary: Create a new local account
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Linked media user not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Username already exists
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/accounts/{id}:
    delete:
      tags: [Admin]
      operationId: deleteAccount
      summary: Delete a local account
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Account deleted
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Account not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Cannot delete self or last remaining admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/accounts/{id}/media-users:
    put:
      tags: [Admin]
      operationId: setLinkedMediaUsers
      summary: Replace linked media server user IDs for an account
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLinkedMediaUsersRequest'
      responses:
        '200':
          description: Updated account with linked media user IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Account or media user not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/api-keys:
    get:
      tags: [Admin]
      operationId: listApiKeys
      summary: List API keys (secrets redacted)
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyListResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags: [Admin]
      operationId: createApiKey
      summary: Create a new API key (raw key returned once)
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Target account not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/api-keys/{id}:
    delete:
      tags: [Admin]
      operationId: revokeApiKey
      summary: Revoke an API key
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API key revoked
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: API key not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/imports/tautulli:
    post:
      tags: [Admin]
      operationId: importTautulliDatabase
      summary: Import historical users and playback history from a Tautulli SQLite database
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: dryRun
          in: query
          required: false
          description: Preview import counts without mutating the database
          schema:
            type: boolean
            default: false
        - name: serverId
          in: query
          required: false
          description: Optional target Miru media server ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Tautulli tautulli.db SQLite database file (max 256 MiB)
                dryRun:
                  type: boolean
                  description: Optional form field override when dryRun query parameter is omitted
                serverId:
                  type: string
                  description: Optional target Miru media server ID when serverId query parameter is omitted
      responses:
        '200':
          description: Tautulli import or dry-run report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TautulliImportResponse'
        '400':
          description: Invalid upload, non-SQLite file, or missing Tautulli tables
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Target media server not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/plex/status:
    get:
      tags: [Admin]
      operationId: getPlexConnectionStatus
      summary: Get current Plex connection status and credential source
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Plex connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexConnectionStatus'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/plex/oauth/start:
    post:
      tags: [Admin]
      operationId: startPlexOAuth
      summary: Start a Plex PIN OAuth session
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Plex PIN OAuth session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexOAuthStartResponse'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream Plex.tv error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/plex/oauth/poll/{pinId}:
    get:
      tags: [Admin]
      operationId: pollPlexOAuth
      summary: Poll Plex PIN OAuth authorization status
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: pinId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Current PIN authorization status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexOAuthPollResponse'
        '400':
          description: Invalid PIN identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: OAuth PIN session not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream Plex.tv error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/plex/oauth/servers:
    get:
      tags: [Admin]
      operationId: discoverPlexServers
      summary: Discover Plex Media Servers accessible to the authorized PIN session
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: pinId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Discovered Plex servers and prioritized connection URIs (tokens omitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexDiscoveredServersResponse'
        '400':
          description: Invalid PIN identifier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Authorized OAuth session not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: OAuth PIN session is not authorized or has expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream Plex.tv error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/admin/plex/oauth/select:
    post:
      tags: [Admin]
      operationId: selectPlexServer
      summary: Persist encrypted Plex credentials for the selected server and hot-reload runtime
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlexSelectServerRequest'
      responses:
        '200':
          description: Server credentials saved and runtime status returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlexSelectServerResponse'
        '400':
          description: Validation error or missing MIRU_ENCRYPTION_KEY
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: OAuth session or Plex server not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: OAuth PIN session is not authorized or has expired
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream Plex.tv error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/media/{ratingKey}:
    get:
      tags: [Media]
      operationId: getMediaDetails
      summary: Retrieve rich media details, series/season context, technical specs, and Miru play summary
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: ratingKey
          in: path
          required: true
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Media item details with optional series/season context and RBAC-scoped play summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaDetailsResponse'
        '400':
          description: Invalid ratingKey
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Media item not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
