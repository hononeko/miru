      responses:
        '200':
          description: Aggregated overview playback statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewStatsResponse'
        '400':
          description: Invalid range parameter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/users/{id}/stats:
    get:
      tags: [Stats]
      operationId: getUserStats
      summary: Retrieve playback statistics for a specific media user
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        '200':
          description: User-scoped playback statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsResponse'
        '400':
          description: Invalid range parameter
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden access to target media user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Media user not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/libraries:
    get:
      tags: [Libraries]
      operationId: listLibraries
      summary: List library sections with item counts, storage totals, and sync timestamps
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: serverId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of library sections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryListResponse'
        '401':
