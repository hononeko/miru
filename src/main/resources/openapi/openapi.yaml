          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/libraries/{id}/recent:
    get:
      tags: [Libraries]
      operationId: getLibraryRecentlyAdded
      summary: Get recently added media items for a library section
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: serverId
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Recently added media items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentMediaListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Library section not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Ambiguous section key across multiple servers
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/libraries/sync:
    post:
      tags: [Libraries]
      operationId: triggerLibrarySync
      summary: Trigger an immediate fast or deep library sync (admin only)
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: deep
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: sectionKey
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Library sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySyncResponse'
        '400':
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Library section not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream media server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: miru_session
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: miru
        version:
          type: string
          example: 0.1.0

    DependencyCheckStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        detail:
          type: string

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyCheckStatus'

    ProblemDetails:
      type: object
      description: RFC 7807 / RFC 9457 Problem Details error response
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          example: https://miru.hononeko.app/errors/validation
        title:
          type: string
          example: Validation Error
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Invalid request parameters
        instance:
          type: string
          example: /api/v1/history
        errors:
          type: object
          additionalProperties:
            type: string

    MiruRole:
      type: string
      enum: [ADMIN, USER]

    AuthSource:
      type: string
      enum: [SESSION_COOKIE, API_KEY, DEV_BYPASS]

    AuthStatusResponse:
      type: object
      required: [authMode, setupRequired]
      properties:
        authMode:
          type: string
          enum: [local, oidc, none]
        setupRequired:
          type: boolean
        localEnabled:
          type: boolean
          nullable: true
        oidcEnabled:
          type: boolean
          nullable: true
        oidcDisplayName:
          type: string
          nullable: true

    AuthProvidersResponse:
      type: object
      required: [authMode, localEnabled, oidcEnabled, oidcDisplayName, setupRequired]
      properties:
        authMode:
          type: string
          enum: [local, oidc, none]
        localEnabled:
          type: boolean
        oidcEnabled:
          type: boolean
        oidcDisplayName:
          type: string
        oidcLoginUrl:
          type: string
          nullable: true
        oidcLogoutUrl:
          type: string
          nullable: true
        setupRequired:
          type: boolean

    SetupAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 12
        email:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    PrincipalResponse:
      type: object
      required: [accountId, username, role, linkedMediaUserIds, authSource]
      properties:
        accountId:
          type: string
        username:
          type: string
        email:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/MiruRole'
        linkedMediaUserIds:
          type: array
          items:
            type: string
        authSource:
          $ref: '#/components/schemas/AuthSource'

    AccountResponse:
      type: object
      required: [id, username, role, disabled, authProvider, linkedMediaUserIds, createdAtMs, updatedAtMs]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/MiruRole'
        disabled:
          type: boolean
        authProvider:
          type: string
        linkedMediaUserIds:
          type: array
          items:
            type: string
        createdAtMs:
          type: integer
          format: int64
        updatedAtMs:
          type: integer
          format: int64

    AccountListResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountResponse'

    CreateAccountRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 12
        email:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/MiruRole'
        linkedMediaUserIds:
          type: array
          items:
            type: string

    SetLinkedMediaUsersRequest:
      type: object
      required: [mediaUserIds]
      properties:
        mediaUserIds:
          type: array
          items:
            type: string

    CreateApiKeyRequest:
      type: object
      required: [name]
      properties:
        accountId:
          type: string
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          $ref: '#/components/schemas/MiruRole'
        expiresAtMs:
          type: integer
          format: int64
          nullable: true

    ApiKeyResponse:
      type: object
      required: [id, accountId, name, keyPrefix, role, createdAtMs]
      properties:
        id:
          type: string
        accountId:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
        role:
          $ref: '#/components/schemas/MiruRole'
        lastUsedAtMs:
          type: integer
          format: int64
          nullable: true
        expiresAtMs:
          type: integer
          format: int64
          nullable: true
        revokedAtMs:
          type: integer
          format: int64
          nullable: true
        createdAtMs:
          type: integer
          format: int64

    ApiKeyListResponse:
      type: object
      required: [apiKeys]
      properties:
        apiKeys:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyResponse'

    CreateApiKeyResponse:
      type: object
      required: [apiKey, rawKey]
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKeyResponse'
        rawKey:
          type: string

    ActiveStreamsResponse:
      type: object
      required: [streams, totalCount]
      properties:
        streams:
          type: array
          items:
            $ref: '#/components/schemas/ActiveStreamDto'
        totalCount:
          type: integer
          format: int32

    ActiveStreamDto:
      type: object
      required:
        - serverId
        - sessionKey
        - user
        - media
        - player
        - technical
        - state
        - viewOffsetMs
        - progressPercent
        - startedAtMs
        - lastSeenAtMs
        - pausedDurationSec
      properties:
        serverId:
          type: string
        sessionKey:
          type: string
        sessionId:
          type: string
          nullable: true
        user:
          $ref: '#/components/schemas/StreamUserDto'
        media:
          $ref: '#/components/schemas/StreamMediaDto'
        player:
          $ref: '#/components/schemas/StreamPlayerDto'
        technical:
          $ref: '#/components/schemas/StreamTechnicalDto'
        state:
          type: string
        viewOffsetMs:
          type: integer
          format: int64
        progressPercent:
          type: number
          format: double
        startedAtMs:
          type: integer
          format: int64
        lastSeenAtMs:
          type: integer
          format: int64
        pausedDurationSec:
          type: integer
          format: int32

    StreamUserDto:
      type: object
      required: [id]
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true

    StreamMediaDto:
      type: object
      required: [ratingKey, mediaType, title, durationMs]
      properties:
        ratingKey:
          type: string
        mediaType:
          type: string
        title:
          type: string
        parentTitle:
          type: string
          nullable: true
        grandparentTitle:
          type: string
          nullable: true
        parentIndex:
          type: integer
          format: int32
          nullable: true
        mediaIndex:
          type: integer
          format: int32
          nullable: true
        year:
          type: integer
          format: int32
          nullable: true
        thumbUrl:
          type: string
          nullable: true
        librarySectionKey:
          type: string
          nullable: true
        durationMs:
          type: integer
          format: int64

    StreamPlayerDto:
      type: object
      properties:
        name:
          type: string
          nullable: true
        platform:
          type: string
          nullable: true
        product:
          type: string
          nullable: true
        machineId:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        location:
          type: string
          nullable: true

    StreamTechnicalDto:
      type: object
      required: [streamDecision, hwTranscode, throttled]
      properties:
        streamDecision:
          type: string
        videoDecision:
          type: string
          nullable: true
        audioDecision:
          type: string
          nullable: true
        hwTranscode:
          type: boolean
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true
        videoResolution:
          type: string
          nullable: true
        bandwidthKbps:
          type: integer
          format: int32
          nullable: true
        container:
          type: string
          nullable: true
        transcodeVideoCodec:
          type: string
          nullable: true
        transcodeAudioCodec:
          type: string
          nullable: true
        transcodeContainer:
          type: string
          nullable: true
        transcodeProgress:
          type: number
          format: double
          nullable: true
        transcodeSpeed:
          type: number
          format: double
          nullable: true
        throttled:
          type: boolean

    SessionStartedEventDto:
      type: object
      required: [timestampMs, stream]
      properties:
        timestampMs:
          type: integer
          format: int64
        stream:
          $ref: '#/components/schemas/ActiveStreamDto'

    SessionUpdatedEventDto:
      type: object
      required: [timestampMs, stream, previousState, previousStreamDecision, streamDecisionChanged]
      properties:
        timestampMs:
          type: integer
          format: int64
        stream:
          $ref: '#/components/schemas/ActiveStreamDto'
        previousState:
          type: string
        previousStreamDecision:
          type: string
        streamDecisionChanged:
          type: boolean

    SessionStoppedEventDto:
      type: object
      required: [timestampMs, serverId, sessionKey, ratingKey, userId, reason, mergedIntoHistory, stream]
      properties:
        timestampMs:
          type: integer
          format: int64
        serverId:
          type: string
        sessionKey:
          type: string
        ratingKey:
          type: string
        userId:
          type: string
        reason:
          type: string
        mergedIntoHistory:
          type: boolean
        historyId:
          type: string
          nullable: true
        stream:
          $ref: '#/components/schemas/ActiveStreamDto'

    UsersListResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSummaryDto'

    UserSummaryDto:
      type: object
      required:
        - id
        - serverId
        - externalUserId
        - username
        - isAdmin
        - isStreaming
        - activeStreamCount
        - totalPlays
        - totalWatchDurationSec
      properties:
        id:
          type: string
        serverId:
          type: string
        externalUserId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        isAdmin:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        isStreaming:
          type: boolean
        activeStreamCount:
          type: integer
          format: int32
        lastSeenAtMs:
          type: integer
          format: int64
          nullable: true
        totalPlays:
          type: integer
          format: int64
        totalWatchDurationSec:
          type: integer
          format: int64

    UserRecentPlayDto:
      type: object
      required:
        - id
        - serverId
        - ratingKey
        - mediaType
        - title
        - durationMs
        - viewOffsetMs
        - watchedDurationSec
        - pausedDurationSec
        - completionPercent
        - isWatched
        - streamDecision
        - hwTranscode
        - startedAtMs
        - stoppedAtMs
      properties:
        id:
          type: string
        serverId:
          type: string
        ratingKey:
          type: string
        mediaType:
          type: string
        title:
          type: string
        parentTitle:
          type: string
          nullable: true
        grandparentTitle:
          type: string
          nullable: true
        parentIndex:
          type: integer
          format: int32
          nullable: true
        mediaIndex:
          type: integer
          format: int32
          nullable: true
        year:
          type: integer
          format: int32
          nullable: true
        thumbUrl:
          type: string
          nullable: true
        librarySectionKey:
          type: string
          nullable: true
        durationMs:
          type: integer
          format: int64
        viewOffsetMs:
          type: integer
          format: int64
        watchedDurationSec:
          type: integer
          format: int32
        pausedDurationSec:
          type: integer
          format: int32
        completionPercent:
          type: number
          format: double
        isWatched:
          type: boolean
        streamDecision:
          type: string
        hwTranscode:
          type: boolean
        videoResolution:
          type: string
          nullable: true
        playerName:
          type: string
          nullable: true
        playerPlatform:
          type: string
          nullable: true
        playerProduct:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startedAtMs:
          type: integer
          format: int64
        stoppedAtMs:
          type: integer
          format: int64

    UserUsageStatDto:
      type: object
      required: [name, playCount, watchDurationSec]
      properties:
        name:
          type: string
        playCount:
