          type: string
          enum: [system, dark, light]
        timeFormat:
          type: string
          enum: [24h, 12h]
        dateFormat:
          type: string
          enum: [iso, mdy, dmy]
        defaultStatsRange:
          type: string
          enum: [7d, 30d, 90d, all]
        relativeTimestamps:
          type: boolean
        updatedAtMs:
