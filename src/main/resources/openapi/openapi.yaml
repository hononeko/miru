          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Stale or unwatched media hygiene report for the section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaleMediaListResponse'
        '400':
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Access to the requested library section is forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Library section not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Ambiguous section key across multiple servers
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/libraries/sync:
    post:
      tags: [Libraries]
      operationId: triggerLibrarySync
      summary: Trigger an immediate fast or deep library sync and reconcile shared-library permissions (admin only)
      security:
        - CookieAuth: []
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: deep
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: sectionKey
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Library sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibrarySyncResponse'
        '400':
          description: Invalid query parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrator role required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Library section not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Upstream media server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: miru_session
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    BearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: miru
        version:
          type: string
          example: 0.1.0

    DependencyCheckStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        detail:
          type: string

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DependencyCheckStatus'

    ProblemDetails:
      type: object
      description: RFC 7807 / RFC 9457 Problem Details error response
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          example: https://miru.hononeko.app/errors/validation
        title:
          type: string
          example: Validation Error
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Invalid request parameters
        instance:
          type: string
          example: /api/v1/history
        errors:
          type: object
          additionalProperties:
            type: string

    MiruRole:
      type: string
      enum: [ADMIN, USER]

    AuthSource:
      type: string
      enum: [SESSION_COOKIE, API_KEY, DEV_BYPASS]

    AuthStatusResponse:
      type: object
      required: [authMode, setupRequired]
      properties:
        authMode:
          type: string
          enum: [local, oidc, none]
        setupRequired:
          type: boolean
        localEnabled:
          type: boolean
          nullable: true
        oidcEnabled:
          type: boolean
          nullable: true
        oidcDisplayName:
          type: string
          nullable: true

    AuthProvidersResponse:
      type: object
      required: [authMode, localEnabled, oidcEnabled, oidcDisplayName, setupRequired]
      properties:
        authMode:
          type: string
          enum: [local, oidc, none]
        localEnabled:
          type: boolean
        oidcEnabled:
          type: boolean
        oidcDisplayName:
          type: string
        oidcLoginUrl:
          type: string
          nullable: true
        oidcLogoutUrl:
          type: string
          nullable: true
        setupRequired:
          type: boolean

    SetupAdminRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 12
          description: Must be at least 12 characters and include at least 1 lowercase letter, 1 uppercase letter, and 1 digit.
        email:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    PrincipalResponse:
      type: object
      required: [accountId, username, role, linkedMediaUserIds, authSource]
      properties:
        accountId:
          type: string
        username:
          type: string
        email:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/MiruRole'
        linkedMediaUserIds:
          type: array
          items:
            type: string
        authSource:
          $ref: '#/components/schemas/AuthSource'
        avatarUrl:
          type: string
          nullable: true

    UserPreferencesResponse:
      type: object
      required: [theme, timeFormat, dateFormat, defaultStatsRange, relativeTimestamps]
      properties:
